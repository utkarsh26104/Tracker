[project]
name = "tracker"
version = "0.1.0"
description = "Autonomous multi-agent competitive intelligence tracker (LangGraph + Groq + ChromaDB)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.13",
    "psycopg[binary,pool]>=3.2",
    "langchain-core>=0.3.28",
    "langchain-groq>=0.2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tavily-python>=0.5.0",
    "requests>=2.32",  # used directly in app/graph/master_graph.py for retry classification
    "groq>=0.11",      # used directly in app/graph/master_graph.py for rate-limit retry classification
    "python-dateutil>=2.9",  # used directly in app/graph/writer.py to sort findings by real publish date
    "transformers>=4.46,<5",  # finbert-tone/finbert ship legacy slow tokenizers only; v5 dropped that path
    "sentencepiece>=0.2",     # needed for slow->fast tokenizer conversion on FinBERT models
    "tiktoken>=0.8",
    "torch>=2.5",
    "chromadb>=0.5.20",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "streamlit>=1.40",
    "xhtml2pdf>=0.2.16",
    "markdown>=3.7",
    "pypdf>=5.1",  # extracts text from uploaded client-dossier PDFs
    "langfuse>=3.0,<5",  # optional LLM tracing - no-op until LANGFUSE_* env vars are set
    "langchain>=0.3",  # langfuse.langchain.CallbackHandler hard-requires the full package, not just langchain-core
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
# Only app/ is an installable package - ui/streamlit_app.py and scripts/*.py
# are run directly (not imported via package namespace), and data/ is
# runtime storage (data/client_context_template.csv is the one file tracked
# in git). Without this, setuptools' implicit flat-layout discovery finds
# ui/, app/, and data/ as ambiguous top-level package candidates and refuses
# to build at all - this bites `pip install -e .` on any fresh checkout,
# CI included, not just local dev.
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
