services:
  - type: web
    name: tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Deploys only via the GitHub Actions deploy job (.github/workflows/ci.yml),
    # which hits this service's Deploy Hook after the test suite passes - not
    # on every raw push the way Render's default git-integration behaves.
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_SUPERVISOR_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_WRITER_MODEL
        value: openai/gpt-oss-120b
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: FINBERT_EMBED_MODEL
        value: yiyanghkust/finbert-tone
      - key: FINBERT_SENTIMENT_MODEL
        value: ProsusAI/finbert
      # Optional - leave blank in the Render dashboard to keep Langfuse
      # inactive (app/observability.py falls back to logging-only). LANGFUSE_HOST
      # isn't listed since app/config.py's default already matches Langfuse Cloud.
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
