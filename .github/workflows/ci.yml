name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Hardcoded lowercase, not `ghcr.io/${{ github.repository }}` - Docker
  # registry names must be lowercase and this repo's name (Tracker) isn't;
  # GitHub Actions' expression language has no built-in lowercase function.
  IMAGE_NAME: ghcr.io/utkarsh26104/tracker

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres so the checkpoint/HITL/Map-Reduce integration tests
      # actually run instead of self-skipping (see tests/conftest.py's
      # pg_pool fixture). No Groq/Tavily secrets needed - the full suite's
      # LLM/Tavily calls are mocked.
      DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Required for cache-from/cache-to: type=gha below - the runner's
      # default buildx driver doesn't support the gha cache backend, only
      # the docker-container driver this action sets up does. Without this
      # step, the build fails outright ("buildx failed with: ... see
      # build-cache-backends"), not just silently skip caching.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Build on every push/PR to validate the Dockerfile still builds,
          # but only publish on pushes to master - a PR from an untrusted
          # fork shouldn't be able to publish an image under this repo's name.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Render builds tracker-api from the repo's own Dockerfile (render.yaml
      # sets runtime: docker) rather than pulling the image this workflow
      # just pushed to GHCR - build-and-push above stays purely as a CI
      # check that the Dockerfile builds, and as a pullable artifact.
      # render.yaml sets autoDeploy: false specifically so a deploy only
      # fires here, after the test job has passed, instead of on every raw
      # push the way Render's default git-integration behaves. One-time
      # setup: Render dashboard -> tracker-api -> Settings -> Deploy Hook ->
      # copy the URL -> add it as the RENDER_DEPLOY_HOOK_URL repo secret.
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
